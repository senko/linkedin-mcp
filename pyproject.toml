[project]
name = "linkedin-mcp"
version = "0.1.0"
description = "Personal LinkedIn gateway: MCP server for the LinkedIn Member Data Portability (DMA) API"
authors = [
    { name = "Senko Rasic", email = "senko@senko.net" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
linkedin-mcp = "linkedin_mcp.cli:entry_point"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
    "ty>=0.0.90",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "ASYNC", "PT", "RET", "PTH",
    "ANN", # type annotations everywhere
    "D",   # docstrings everywhere
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ty.rules]
possibly-unresolved-reference = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--cov", "--cov-report=term-missing"]

[tool.coverage.run]
source = ["linkedin_mcp"]
branch = true
# The MCP and CLI layers are thin wrappers and are not unit tested.
omit = ["*/linkedin_mcp/server.py", "*/linkedin_mcp/cli.py", "*/linkedin_mcp/__main__.py"]
